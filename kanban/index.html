<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadro Kanban</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" referrerpolicy="no-referrer" />


</head>
    <body>
        <div class="app">
            <div class="task-input-container">
                <div class="task-input-fields">
                    <input type="text" id="taskTitle" placeholder="Título da nova tarefa">
                    <input type="text" id="taskComment" placeholder="Descreva a tarefa">
                    <select id="taskColumn">
                        <option value="1">Devoluções</option>
                        <option value="2">Pendências</option>
                        <option value="3">A fazer</option>
                        <option value="4">Em andamento</option>
                        <option value="5">Concluído</option>
                    </select>
                    <select  id="priority">
                        <option value="1">Baixa</option>
                        <option value="2">Média</option>
                        <option value="3">Alta</option>
                    </select>
                    <button id="addTaskBtn">Adicionar</button>
                </div>
            </div>
            <main class="kanban">
                <!--DEVOLUÇõES-->
                <div class="kanban-column" data-id="1">
                    <div class="kanban-title">
                        <h2>Devoluções</h2>  
                    </div>
                    <div class="kanban-cards">
                        <!--Cartões serão inseridos aqui!-->
                        
                    </div>
                </div>
                <!--Pendências-->
                <div class="kanban-column" data-id="2">
                    <div class="kanban-title">
                        <h2>Pendências</h2>
                    </div>
                    <div class="kanban-cards">
                        <!--Cartões serão inseridos aqui!-->
                        
                    </div>
                </div>
                <!--A fazer-->
                <div class="kanban-column" data-id="3">
                    <div class="kanban-title">
                        <h2>A fazer</h2>
                    </div>
                    <div class="kanban-cards">
                        <!--Cartões serão inseridos aqui!-->
                        
                    </div>
                </div>
                <!--Em andamento-->
                <div class="kanban-column" data-id="4">
                    <div class="kanban-title">
                        <h2>Em andamento</h2>
                    </div>
                    <div class="kanban-cards">
                        <!--Cartões serão inseridos aqui!-->
                        
                    </div>
                </div>
                <!--Concluído-->
                <div class="kanban-column" data-id="5">
                    <div class="kanban-title">
                        <h2>Concluído</h2>
                    </div>
                    <div class="kanban-cards">
                        <!--Cartões serão inseridos aqui!-->
                        <!--<div class="kanban-card" draggable="true">
                            <div class="badge medium">
                                <span> Média prioridade </span>
                            </div>
                            <p class="card-title">Revisar documento do projeto</p>
                            <div class="card-infos">
                                <div class="card-icons">
                                    <p><i class="fa-regular fa-comment"></i>1</p>
                                    <div><p class="comment"></p></div>
                                </div>
                                <div class="user">
                                    <button class="edit-btn">
                                        <i class="fa-solid fa-pen"></i>
                                    </button>
                                    <button class="delete-btn">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>!-->
                    </div>
                </div>
            </main>
        </div>

        <div id="toast-container"></div>
        <script src="script2.js"></script>
    </body>
</html>
